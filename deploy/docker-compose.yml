services:
  update-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://updates:updates@postgres:5432/updates?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
      API_KEY: change-me
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_ISSUER: multi-platform-distribution
      JWT_TTL: 24h
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_NAME: Administrator
      BOOTSTRAP_ADMIN_PASSWORD: change-me-now
      AUTO_MIGRATE: "true"
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/data/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/data/uploads
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: updates
      POSTGRES_USER: updates
      POSTGRES_PASSWORD: updates
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
  uploads-data:
