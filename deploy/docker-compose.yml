services:
  update-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://updates:updates@postgres:5432/updates?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      API_KEY: change-me
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_ISSUER: multi-platform-distribution
      JWT_TTL: 24h
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_NAME: Administrator
      BOOTSTRAP_ADMIN_PASSWORD: change-me-now
      AUTO_MIGRATE: "true"
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/data/uploads
      ANYSHARE_ENABLED: "true"
      ANYSHARE_BASE_URL: https://yunpan.ustb.edu.cn
      ANYSHARE_SHARING_LINK: https://yunpan.ustb.edu.cn/link/AA60DDB0BEB3F141A98A7DF75B5F5D7992
      ANYSHARE_UPLOAD_PATH: gns://F766A255ECA64F50B6DD2F7BC692D48F/E36728FC86E441B9A1E4A13BCC12B572
      ANYSHARE_COOKIE: ${ANYSHARE_COOKIE:-}
      ANYSHARE_TIMEOUT: 10m
      ANYSHARE_REFRESH_INTERVAL: 30m
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/data/uploads
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: updates
      POSTGRES_USER: updates
      POSTGRES_PASSWORD: updates
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
  uploads-data:
